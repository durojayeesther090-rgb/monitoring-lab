---
- name: Install Node Exporter on all servers
  hosts: all
  become: true
  tasks:
    - name: Install Node Exporter
      apt:
        name: prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Start and enable Node Exporter
      service:
        name: prometheus-node-exporter
        state: started
        enabled: yes

- name: Install Prometheus and Grafana on the monitor server
  hosts: monitor
  become: true
  tasks:
    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present

    - name: Install Prometheus
      apt:
        name: prometheus
        state: present

    - name: Copy Prometheus configuration
      copy:
        src: prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"

    - name: Restart Prometheus
      service:
        name: prometheus
        state: restarted
        enabled: yes

    - name: Download Grafana GPG key
      get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Add Prometheus as a Grafana data source
      copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true

    - name: Start and enable Grafana
      service:
        name: grafana-server
        state: restarted
        enabled: yes

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["172.31.24.96:9100"]
        labels:
          server: "monitor-server"
      - targets: ["172.31.25.176:9100"]
        labels:
          server: "target-server"
